# Banco de dados MySQL para desenvolvimento local.
# Uso: docker compose up -d
services:
  db:
    image: mysql:8.4
    container_name: cyberacademy-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: cyberacademy
      MYSQL_USER: cyber
      MYSQL_PASSWORD: cyber123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
